{% extends 'productBase.html' %}
{% block title %}ProductAdd{% endblock %}
{% block content %}
    <div class="w-full h-full flex flex-col justify-center items-center text-white">
        <div class="w-fit overflow-y p-10 mt-10 flex flex-col justify-center items-center bg-blue-800/50 rounded-md">
            <p class="mb-10 text-4xl font-bold">Add Product</p>
            <form action="/product/add/submit" method="POST">
                <label for="name" class="mx-3">Product Name:</label>
                <input type="text" id="pname" name="pname" required class="border-1 rounded-sm h-8 px-3" placeholder="Enter your product name"><br><br>

                <label for="role" class="mx-3">Price:</label>
                <input type="text" id="price" name="price" required class="border-1 rounded-sm h-8 px-3" placeholder="Enter your price"><br><br>

                <label for="role" class="mx-2">Quantity:</label>
                <input type="text" id="qty" name="qty" required class="border-1 rounded-sm h-8 px-3" placeholder="Enter your quantity"><br><br>

                <input type="submit" value="Submit" class="w-30 h-8 ml-auto cursor-pointer rounded-md border-1 hover:bg-blue-500">
            </form>
        </div>
    </div>
{% endblock %}
