{% extends 'user/userBase.html' %}
{% block title %}User Login{% endblock %}
{% block content %}
    <div class="w-full h-full flex flex-col">
        <div class="w-full h-15 p-2 flex justify-between items-center shadow-xl">
            <p class="text-2xl">Welcome, <span class="text-blue-500 font-bold">{{ uname | title}}</span></p>
            {% if uname %}
                <a href="/logout" class="w-30 p-2 bg-red-400 flex justify-center items-center rounded-md ring-2 font-bold text-xl hover:bg-red-500"><button class="cursor-pointer">Logout</button></a>
            {% endif %}
        </div>
        <div class="w-full h-[calc(100vh-68px)] p-10 bg-blue-400 flex justify-evenly items-center">
            <div class="w-1/3 h-[80%] p-5 bg-white rounded-md border-1 shadow-xl">
                <p class="m-3 text-4xl font-bold">Posts</p>
                {% for post in posts %}
                    <div class="m-3 px-3 flex-col border-1 rounded-md">
                        <span class="text-lg font-bold">{{ post.title }}</span>
                        <p>{{ post.content }}</p>
                    </div>
                {% endfor %}
            </div>
            <div class="w-1/3 h-[80%] p-10 bg-white rounded-md border-1 shadow-xl">
                <p class="mb-10 text-4xl font-bold">New Post</p>
                <form action="/post/add/submit" method="POST" class="flex flex-col justify-evenly">
                    
                    <div class="flex flex-col m-3 text-xl">
                        <label for="name">User Name:</label>
                        <input type="text" id="name" name="name" required class="border-1 rounded-sm h-10 px-3" value="{{ uname | title}}">
                    </div>
                    <div class="flex flex-col m-3 text-xl">
                        <label for="name">Title:</label>
                        <input type="text" id="title" name="title" required class="border-1 rounded-sm h-10 px-3" placeholder="Enter your title">
                    </div>
                    <div class="flex flex-col m-3 text-xl">
                        <label for="role">Content:</label>
                        <textarea name="content" id="content" required class="w-full h-30 border-1 rounded-sm px-3" placeholder="Enter your content"></textarea>
                    </div>
                    <div class="flex flex-col m-3 text-xl">
                        <input type="submit" value="Submit" class="w-30 h-10 ml-auto cursor-pointer rounded-md border-2 bg-white text-blue-500 hover:bg-blue-500 hover:text-white">
                    </div>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
