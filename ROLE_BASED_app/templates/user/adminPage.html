{% extends 'user/userBase.html' %}
{% block title %}Admin Pannel{% endblock title %}
{% block body %}
<div class="w-full h-full flex flex-col font-mono">
    <div class="w-full h-15 p-2 flex justify-between items-center shadow-xl">
        <p class="text-2xl">Welcome, <span class="text-blue-500 font-bold">{{ username | title}}</span></p>
        {% if username %}
        <a href="/logout"
            class="w-30 p-2 bg-red-400 flex justify-center items-center rounded-md ring-2 font-bold text-xl hover:bg-red-500"><button
                class="cursor-pointer">Logout</button></a>
        {% endif %}
    </div>
    <div class="w-full h-[calc(100vh-68px)] p-3 bg-blue-400 flex justify-start items-center">
        <div class="w-1/5 h-full p-3 bg-white shadow-xl rounded-md flex flex-col">
            <p class="m-3 text-4xl font-bold">Dashboard</p>
            <a href="" class="w-full h-12 my-2 p-3 border-1 rounded-md flex justify-start items-center">
                <button class="text-2xl cursor-pointer">
                    <i class="fa-solid fa-list-check px-3"></i>Tasks
                </button></a>
            <a href="" class="w-full h-12 my-2 p-3 border-1 rounded-md flex justify-start items-center">
                <button class="text-2xl cursor-pointer">
                    <i class="fa-solid fa-users px-3"></i>User Management
                </button>
            </a>
        </div>
    </div>
</div>
{% endblock body %}
