{% extends 'user/userBase.html' %}
{% block title %}{{ username | title }}{% endblock title %}
{% block body %}
<div class="w-full h-full flex flex-col">
    <div class="w-full h-15 p-2 flex justify-between items-center shadow-xl">
        <p class="text-2xl">Welcome, <span class="text-blue-500 font-bold">{{ username | title}}</span></p>
        {% if username %}
            <a href="/logout" class="w-30 p-2 bg-red-400 flex justify-center items-center rounded-md ring-2 font-bold text-xl hover:bg-red-500"><button class="cursor-pointer">Logout</button></a>
        {% endif %}
    </div>
</div>
{% endblock body %}
